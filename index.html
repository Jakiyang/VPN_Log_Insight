<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN连接汇总报表</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
.header { background: linear-gradient(135deg, #1a237e, #3949ab); color: white; padding: 24px 36px; border-radius: 12px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.header-left { flex: 1; }
.header-left h1 { font-size: 26px; margin-bottom: 4px; }
.header-left .subtitle { font-size: 13px; opacity: 0.85; }
.header-right { flex-shrink: 0; }
.upload-widget { background: rgba(255,255,255,0.12); border: 2px dashed rgba(255,255,255,0.4); border-radius: 10px; padding: 12px 24px; text-align: center; cursor: pointer; transition: all 0.2s; min-width: 260px; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.upload-widget:hover, .upload-widget.dragover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.8); }
.upload-widget .upload-icon { font-size: 22px; margin-bottom: 6px; }
.upload-widget .upload-text { font-size: 13px; margin-bottom: 4px; }
.upload-widget .upload-hint { font-size: 11px; opacity: 0.75; }
.file-info { background: rgba(255,255,255,0.12); border-radius: 10px; padding: 12px 24px; min-width: 260px; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.file-info .file-name { font-size: 13px; word-break: break-all; margin-bottom: 8px; }
.file-info .btn-reload { display: inline-block; padding: 6px 18px; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); border-radius: 6px; font-size: 12px; cursor: pointer; transition: background 0.2s; }
.file-info .btn-reload:hover { background: rgba(255,255,255,0.3); }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
.stat-card .value { font-size: 32px; font-weight: 700; color: #1a237e; margin-bottom: 4px; }
.stat-card .label { font-size: 13px; color: #666; }
.stat-card .sub { font-size: 11px; color: #999; margin-top: 2px; }
.section { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px; }
.section h2 { font-size: 20px; color: #1a237e; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid #e8eaf6; }
.section h3 { font-size: 15px; color: #333; margin-bottom: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #e8eaf6; color: #1a237e; padding: 10px 12px; text-align: left; font-weight: 600; position: sticky; top: 0; z-index: 10; }
td { padding: 8px 12px; border-bottom: 1px solid #eee; }
tr:hover td { background: #f5f7fa; }
.table-wrap { max-height: 600px; overflow-y: auto; border-radius: 8px; }
.bar-row { display: flex; align-items: center; width: 100%; }
.bar-container { flex: 1; min-width: 300px; background: #f0f0f0; border-radius: 4px; height: 24px; position: relative; }
.bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #3949ab, #5c6bc0); }
.bar-text { flex: none; width: 150px; padding-left: 8px; white-space: nowrap; font-weight: 600; font-size: 13px; color: #333; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.tag-win { background: #e3f2fd; color: #1565c0; }
.tag-ios { background: #fce4ec; color: #c62828; }
.tag-harmony { background: #f3e5f5; color: #6a1b9a; }
.tag-other { background: #f5f5f5; color: #616161; }
.rank { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; font-size: 12px; font-weight: 700; }
.rank-1 { background: #ffd700; color: #333; }
.rank-2 { background: #c0c0c0; color: #333; }
.rank-3 { background: #cd7f32; color: white; }
.rank-other { background: #e0e0e0; color: #666; }
.footer { text-align: center; padding: 20px; color: #999; font-size: 12px; }
@media print { .table-wrap { max-height: none; } }
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="header-left">
<h1>VPN 连接汇总报表</h1>
<div class="subtitle">报表生成时间：<span id="genTime"></span></div>
</div>
<div class="header-right">
<div class="upload-widget" id="uploadWidget">
<div class="upload-icon">📁</div>
<div class="upload-text">拖入 CSV 文件或点击选择</div>
<div class="upload-hint" id="uploadHint"></div>
<input type="file" id="fileInput" accept=".csv" style="display:none;">
</div>
</div>
</div>
<div id="report"></div>
</div>
<script>
// ===== Utility Functions =====
function cleanVal(v) {
    if (v == null) return '';
    v = String(v).trim().replace(/\t+$/, '').trim();
    if (v.startsWith('"') && v.endsWith('"')) v = v.slice(1, -1);
    if (v.startsWith('""') && v.endsWith('""')) v = v.slice(2, -2);
    v = v.trim().replace(/\t+$/, '').trim();
    if (v === '-' || v === ' -') return '';
    return v;
}
function parseOnlineTime(detail) {
    if (!detail) return null;
    detail = detail.replace(/""/g, '"');
    const m = detail.match(/"onlineTime"\s*:\s*(\d+)/);
    return m ? parseInt(m[1]) : null;
}
function fmtDuration(seconds) {
    if (seconds == null || isNaN(seconds)) return '-';
    seconds = Math.round(seconds);
    const d = Math.floor(seconds / 86400);
    const h = Math.floor((seconds % 86400) / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    if (d > 0) return d + '天 ' + h + '小时 ' + m + '分';
    if (h > 0) return h + '小时 ' + m + '分 ' + s + '秒';
    if (m > 0) return m + '分 ' + s + '秒';
    return s + '秒';
}
function parseOrgPath(org) {
    if (!org) return ['', ''];
    const parts = org.replace(/^\/+|\/+$/g, '').split('/');
    if (parts.length >= 2) return [parts[0], parts[1]];
    if (parts.length === 1) return [parts[0], ''];
    return ['', ''];
}
function esc(v) {
    if (v == null) return '';
    return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseDate(s) {
    if (!s) return null;
    const d = new Date(s.replace(' ', 'T'));
    return isNaN(d.getTime()) ? null : d;
}
function dateStr(d) {
    if (!d) return '-';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dateOnly(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function daysBetween(a, b) {
    return Math.round((b - a) / 86400000);
}

// ===== CSV Parser =====
function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = [];
    let row = [], field = '', inQ = false, i = 0;
    while (i < text.length) {
        const ch = text[i];
        if (inQ) {
            if (ch === '"') {
                if (text[i+1] === '"') { field += '"'; i += 2; }
                else { inQ = false; i++; }
            } else { field += ch; i++; }
        } else {
            if (ch === '"') { inQ = true; i++; }
            else if (ch === ',') { row.push(field); field = ''; i++; }
            else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; }
            else if (ch === '\r') { i++; }
            else { field += ch; i++; }
        }
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
}

// ===== Main Processing =====
function handleFile(file) {
    const hint = document.getElementById('uploadHint');
    hint.textContent = '正在读取文件...';
    const reader = new FileReader();
    reader.onload = function(ev) {
        try { processCSV(ev.target.result, file.name); }
        catch(err) {
            hint.textContent = '处理失败: ' + err.message;
            console.error(err);
        }
    };
    reader.readAsText(file, 'UTF-8');
}

function processCSV(text, fileName) {
    const hint = document.getElementById('uploadHint');
    hint.textContent = '正在解析CSV...';
    setTimeout(() => {
        const rows = parseCSV(text);
        if (rows.length < 2) { hint.textContent = 'CSV文件为空或格式错误'; return; }
        const cols = rows[0].map(cleanVal);
        const dataRows = rows.slice(1).map(r => {
            const obj = {};
            for (let i = 0; i < cols.length; i++) obj[i] = cleanVal(r[i] || '');
            return obj;
        });
        const OP_TYPE=2, OP_DETAIL=10, TIME=1, USERNAME=13, DISPLAY=14, ORG=15, OS=24, IP_CITY=35;
        const allRecords = [], logins = [], logouts = [];
        for (const r of dataRows) {
            r._time = parseDate(r[TIME]);
            r._online_time = parseOnlineTime(r[OP_DETAIL]);
            allRecords.push(r);
            if (r[OP_TYPE] === '注销') logouts.push(r);
            else if (r[OP_TYPE] === '登录') logins.push(r);
        }
        const logoutWithTime = logouts.filter(r => r._online_time != null && r._time);
        const totalRecords = allRecords.length, totalLogins = logins.length, totalLogouts = logouts.length;
        const userSet = new Set();
        for (const r of allRecords) if (r[USERNAME]) userSet.add(r[USERNAME]);
        const uniqueUsers = userSet.size;
        let dateMin = null, dateMax = null;
        for (const r of allRecords) {
            if (!r._time) continue;
            if (!dateMin || r._time < dateMin) dateMin = r._time;
            if (!dateMax || r._time > dateMax) dateMax = r._time;
        }
        const dates = logoutWithTime.map(r => dateOnly(r._time)).sort((a,b) => a - b);
        const dataMinDate = dates[0], dataMaxDate = dates[dates.length - 1];
        const totalRangeDays = daysBetween(dataMinDate, dataMaxDate) + 1;
        const userDisplay = {}, userOrg = {};
        for (const r of allRecords) {
            const u = r[USERNAME]; if (!u) continue;
            if (!(u in userDisplay)) userDisplay[u] = r[DISPLAY] || '';
            if (!(u in userOrg)) userOrg[u] = r[ORG] || '';
        }
        // Daily dedup
        const userDayIntervals = new Map();
        for (const r of logoutWithTime) {
            const t = r._time, ot = r._online_time, u = r[USERNAME];
            if (!t || ot == null || !u || ot <= 0) continue;
            const loginT = new Date(t.getTime() - ot * 1000);
            let curDay = dateOnly(loginT);
            while (curDay < t) {
                const nextDay = new Date(curDay.getTime() + 86400000);
                const pStart = loginT > curDay ? loginT : curDay;
                const pEnd = t < nextDay ? t : nextDay;
                if (curDay >= dataMinDate && curDay <= dataMaxDate) {
                    const key = u + '|' + dateStr(curDay);
                    if (!userDayIntervals.has(key)) userDayIntervals.set(key, []);
                    userDayIntervals.get(key).push([pStart, pEnd]);
                }
                curDay = nextDay;
            }
        }
        const dailyRecords = [];
        for (const [key, intervals] of userDayIntervals) {
            intervals.sort((a, b) => a[0] - b[0]);
            const merged = [];
            for (const [s, e] of intervals) {
                if (merged.length && s <= merged[merged.length-1][1]) {
                    merged[merged.length-1][1] = new Date(Math.max(merged[merged.length-1][1], e));
                } else { merged.push([new Date(s), new Date(e)]); }
            }
            let total = 0;
            for (const [s, e] of merged) total += (e - s) / 1000;
            const [u, d] = key.split('|');
            dailyRecords.push([u, d, Math.round(total)]);
        }
        let totalOnlineSeconds = 0;
        for (const [, , sec] of dailyRecords) totalOnlineSeconds += sec;
        const totalOnlineHours = totalOnlineSeconds / 3600;
        // User daily
        const userDailyMap = new Map();
        for (const [u, d, sec] of dailyRecords) {
            if (!userDailyMap.has(u)) userDailyMap.set(u, { total: 0, days: new Set() });
            const e = userDailyMap.get(u); e.total += sec; e.days.add(d);
        }
        const userDaily = [];
        for (const [u, e] of userDailyMap) {
            const activeDays = e.days.size;
            userDaily.push({ user: u, total_seconds: e.total, active_days: activeDays,
                avg_per_day: activeDays > 0 ? e.total / activeDays : 0,
                display: userDisplay[u] || '', org: userOrg[u] || '' });
        }
        userDaily.sort((a, b) => b.active_days - a.active_days || b.avg_per_day - a.avg_per_day);
        // Org
        const userDedupTotal = new Map();
        for (const [u, , sec] of dailyRecords) userDedupTotal.set(u, (userDedupTotal.get(u) || 0) + sec);
        const userOrgTop = {}, userOrgSub = {};
        for (const r of logoutWithTime) {
            const u = r[USERNAME]; if (!u || u in userOrgTop) continue;
            const [t, s] = parseOrgPath(r[ORG] || '');
            userOrgTop[u] = t || '未分类'; userOrgSub[u] = s || '未分类';
        }
        const orgSessions = new Map();
        for (const r of logoutWithTime) {
            const u = r[USERNAME];
            const t = userOrgTop[u] || '未分类', s = userOrgSub[u] || '未分类';
            orgSessions.set(t + '|' + s, (orgSessions.get(t + '|' + s) || 0) + 1);
        }
        const orgAggMap = new Map();
        for (const [u, total] of userDedupTotal) {
            const t = userOrgTop[u] || '未分类', s = userOrgSub[u] || '未分类';
            const key = t + '|' + s;
            if (!orgAggMap.has(key)) orgAggMap.set(key, { org_top: t, org_sub: s, total: 0, users: 0 });
            const e = orgAggMap.get(key); e.total += total; e.users++;
        }
        const orgSubAgg = [];
        for (const [key, e] of orgAggMap) {
            e.sessions = orgSessions.get(key) || 0;
            e.per_user_seconds = e.users > 0 ? e.total / e.users / totalRangeDays : 0;
            orgSubAgg.push(e);
        }
        orgSubAgg.sort((a, b) => b.per_user_seconds - a.per_user_seconds);
        // OS
        const osMap = new Map();
        for (const r of logoutWithTime) {
            const os = r[OS]; if (!os) continue;
            if (!osMap.has(os)) osMap.set(os, { total: 0, sessions: 0, users: new Set() });
            const e = osMap.get(os); e.total += r._online_time; e.sessions++; e.users.add(r[USERNAME]);
        }
        const osAgg = [];
        for (const [os, e] of osMap) osAgg.push({ os, total_seconds: e.total, sessions: e.sessions, users: e.users.size });
        osAgg.sort((a, b) => b.total_seconds - a.total_seconds);
        // City
        const cityMap = new Map();
        for (const r of logoutWithTime) {
            const city = r[IP_CITY]; if (!city || city.indexOf('上海') >= 0) continue;
            if (!cityMap.has(city)) cityMap.set(city, { total: 0, sessions: 0, users: new Set() });
            const e = cityMap.get(city); e.total += r._online_time; e.sessions++; e.users.add(r[USERNAME]);
        }
        const cityAgg = [];
        for (const [city, e] of cityMap) cityAgg.push({ city, total_seconds: e.total, sessions: e.sessions, users: e.users.size });
        cityAgg.sort((a, b) => b.total_seconds - a.total_seconds);
        // Daily trend
        const dailyDedupMap = new Map();
        for (const [u, d, sec] of dailyRecords) {
            if (!dailyDedupMap.has(d)) dailyDedupMap.set(d, { total: 0, users: new Set() });
            const e = dailyDedupMap.get(d); e.total += sec; e.users.add(u);
        }
        const dailySessionsMap = new Map();
        for (const r of logoutWithTime) {
            const d = dateStr(dateOnly(r._time));
            dailySessionsMap.set(d, (dailySessionsMap.get(d) || 0) + 1);
        }
        const dailyAgg = [];
        const allDates = Array.from(new Set([...dailyDedupMap.keys(), ...dailySessionsMap.keys()])).sort();
        for (const d of allDates) {
            const dd = dailyDedupMap.get(d);
            dailyAgg.push({ date: d, sessions: dailySessionsMap.get(d) || 0, total_seconds: dd ? dd.total : 0, users: dd ? dd.users.size : 0 });
        }
        // Hourly login
        const hourlyLogins = new Array(24).fill(0);
        for (const r of logins) if (r._time) hourlyLogins[r._time.getHours()]++;
        const loginAvgs = hourlyLogins.map(c => c / totalRangeDays);
        // Hourly concurrent online (dedup)
        const hourlyOnlineSets = Array.from({length: 24}, () => new Set());
        for (const r of logoutWithTime) {
            const t = r._time, ot = r._online_time, u = r[USERNAME];
            if (!t || ot == null || !u) continue;
            const loginT = new Date(t.getTime() - ot * 1000);
            let cur = new Date(loginT); cur.setMinutes(0, 0, 0);
            while (cur < t) { hourlyOnlineSets[cur.getHours()].add(u + '|' + dateStr(cur)); cur = new Date(cur.getTime() + 3600000); }
        }
        const onlineAvgs = hourlyOnlineSets.map(s => s.size / totalRangeDays);
        // Generate
        hint.textContent = '正在生成报表...';
        setTimeout(() => {
            const html = generateReport({ totalRecords, totalLogins, totalLogouts, uniqueUsers, dateMin, dateMax, totalRangeDays, totalOnlineSeconds, totalOnlineHours, userDaily, orgSubAgg, osAgg, cityAgg, dailyAgg, loginAvgs, onlineAvgs, fileName });
            document.getElementById('report').innerHTML = html;
            // Update header: replace upload widget with file info
            const widget = document.getElementById('uploadWidget');
            widget.outerHTML = `<div class="file-info"><div class="file-name">📄 ${esc(fileName)}</div><button class="btn-reload" onclick="location.reload()">重新上传</button></div>`;
            document.getElementById('genTime').textContent = new Date().toLocaleString('zh-CN');
            window.scrollTo(0, 0);
        }, 50);
    }, 50);
}

function generateReport(d) {
    const avgPerUserDay = d.uniqueUsers > 0 ? d.totalOnlineSeconds / d.uniqueUsers / d.totalRangeDays : 0;
    let h = '';
    h += '<div class="stats-grid">';
    h += `<div class="stat-card"><div class="value">${dateStr(d.dateMin)}</div><div class="label">统计日期起始</div></div>`;
    h += `<div class="stat-card"><div class="value">${dateStr(d.dateMax)}</div><div class="label">统计日期结束</div></div>`;
    h += `<div class="stat-card"><div class="value">${d.totalRangeDays}</div><div class="label">统计天数</div></div>`;
    h += `<div class="stat-card"><div class="value">${d.uniqueUsers}</div><div class="label">独立用户数</div></div>`;
    h += `<div class="stat-card"><div class="value">${d.totalOnlineHours.toLocaleString('en',{maximumFractionDigits:1})}h</div><div class="label">总连接时长</div><div class="sub">${fmtDuration(d.totalOnlineSeconds)}</div></div>`;
    h += `<div class="stat-card"><div class="value">${(avgPerUserDay/3600).toFixed(1)}h</div><div class="label">用户日均连接时长</div><div class="sub">${fmtDuration(avgPerUserDay)}</div></div>`;
    h += '</div>';
    // 1
    h += '<div class="section"><h2>1. 用户每日平均连接时长汇总</h2>';
    h += '<p style="color:#666;margin-bottom:12px;">按活跃天数降序、活跃日均时长降序排列</p>';
    h += '<div class="table-wrap"><table><thead><tr><th>排名</th><th>用户名</th><th>显示名</th><th>所属组织架构</th><th>活跃天数</th><th>总连接时长</th><th>活跃日均时长</th></tr></thead><tbody>';
    const dailyMax = d.userDaily.length > 0 ? Math.max(...d.userDaily.map(r => r.avg_per_day)) : 1;
    d.userDaily.forEach((r, i) => {
        const rc = i < 3 ? 'rank-' + (i+1) : 'rank-other';
        const bp = dailyMax > 0 ? r.avg_per_day / dailyMax * 100 : 0;
        h += `<tr><td><span class="rank ${rc}">${i+1}</span></td><td>${esc(r.user)}</td><td>${esc(r.display)}</td><td>${esc(r.org)}</td><td>${r.active_days} / ${d.totalRangeDays}</td><td>${fmtDuration(r.total_seconds)}</td><td><div class="bar-row"><div class="bar-container"><div class="bar-fill" style="width:${bp.toFixed(1)}%"></div></div><strong class="bar-text">${fmtDuration(r.avg_per_day)}</strong></div></td></tr>`;
    });
    h += '</tbody></table></div></div>';
    // 2
    h += '<div class="section"><h2>2. 部门每日连接时长汇总</h2>';
    h += '<p style="color:#666;margin-bottom:12px;">按日人均连接时长降序排列</p>';
    h += '<div class="table-wrap"><table><thead><tr><th>一级组织</th><th>二级组织</th><th>总连接时长</th><th>日人均连接时长</th><th>会话数</th><th>用户数</th><th>占比</th></tr></thead><tbody>';
    const orgTotal = d.orgSubAgg.length > 0 ? d.orgSubAgg.reduce((s, r) => s + r.total, 0) : 1;
    const perUserMax = d.orgSubAgg.length > 0 ? Math.max(...d.orgSubAgg.map(r => r.per_user_seconds)) : 1;
    d.orgSubAgg.forEach(r => {
        const pct = orgTotal > 0 ? r.total / orgTotal * 100 : 0;
        const bp = perUserMax > 0 ? r.per_user_seconds / perUserMax * 100 : 0;
        h += `<tr><td>${esc(r.org_top)}</td><td><strong>${esc(r.org_sub)}</strong></td><td>${fmtDuration(r.total)}</td><td><div class="bar-row"><div class="bar-container"><div class="bar-fill" style="width:${bp.toFixed(1)}%"></div></div><span class="bar-text">${fmtDuration(r.per_user_seconds)}</span></div></td><td>${r.sessions}</td><td>${r.users}</td><td>${pct.toFixed(1)}%</td></tr>`;
    });
    h += '</tbody></table></div></div>';
    // 3
    h += '<div class="section"><h2>3. 每日连接趋势</h2>';
    h += '<div style="display:flex;gap:20px;margin-bottom:12px;"><span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;"><span style="display:inline-block;width:16px;height:12px;background:linear-gradient(180deg,#3949ab,#5c6bc0);border-radius:2px;"></span>总连接时长（小时）</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;"><span style="display:inline-block;width:16px;height:3px;background:#e65100;border-radius:2px;"></span>独立用户数</span></div>';
    h += generateDailyTrendSVG(d.dailyAgg);
    h += '</div>';
    // 4
    h += '<div class="section"><h2>4. 每小时连接趋势</h2>';
    h += '<div style="display:flex;gap:20px;margin-bottom:12px;"><span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;"><span style="display:inline-block;width:16px;height:12px;background:linear-gradient(180deg,#3949ab,#5c6bc0);border-radius:2px;"></span>平均登录次数</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;"><span style="display:inline-block;width:16px;height:3px;background:#e65100;border-radius:2px;"></span>平均同时在线人数</span></div>';
    h += generateHourlyTrendSVG(d.loginAvgs, d.onlineAvgs);
    h += '</div>';
    // 5
    h += '<div class="section"><h2>5. 按操作系统与接入城市分布</h2>';
    h += '<div style="display:flex;gap:24px;align-items:flex-start;">';
    h += '<div style="flex:1;min-width:0;"><h3 style="font-size:15px;color:#333;margin-bottom:10px;">按操作系统分布</h3>';
    h += '<div class="table-wrap" style="max-height:450px;"><table><thead><tr><th>操作系统</th><th>总连接时长</th><th>会话数</th><th>用户数</th><th>占比</th></tr></thead><tbody>';
    const osTotal = d.osAgg.length > 0 ? d.osAgg.reduce((s, r) => s + r.total_seconds, 0) : 1;
    const osMax = d.osAgg.length > 0 ? Math.max(...d.osAgg.map(r => r.total_seconds)) : 1;
    d.osAgg.forEach(r => {
        const pct = osTotal > 0 ? r.total_seconds / osTotal * 100 : 0;
        const bp = osMax > 0 ? r.total_seconds / osMax * 100 : 0;
        let tag = 'tag-other';
        if (r.os.indexOf('Windows') >= 0) tag = 'tag-win';
        else if (r.os.indexOf('iOS') >= 0 || r.os.indexOf('Mac') >= 0) tag = 'tag-ios';
        else if (r.os.indexOf('Harmony') >= 0 || r.os.indexOf('Android') >= 0) tag = 'tag-harmony';
        h += `<tr><td><span class="tag ${tag}">${esc(r.os)}</span></td><td><div class="bar-row"><div class="bar-container" style="min-width:126px;"><div class="bar-fill" style="width:${bp.toFixed(1)}%"></div></div><span class="bar-text">${fmtDuration(r.total_seconds)}</span></div></td><td>${r.sessions}</td><td>${r.users}</td><td>${pct.toFixed(1)}%</td></tr>`;
    });
    h += '</tbody></table></div></div>';
    h += '<div style="flex:1;min-width:0;"><h3 style="font-size:15px;color:#333;margin-bottom:10px;">按接入城市分布（除上海市外）</h3>';
    h += '<div class="table-wrap" style="max-height:450px;"><table><thead><tr><th>城市</th><th>总连接时长</th><th>会话数</th><th>用户数</th></tr></thead><tbody>';
    const cityMax = d.cityAgg.length > 0 ? Math.max(...d.cityAgg.map(r => r.total_seconds)) : 1;
    d.cityAgg.forEach(r => {
        const bp = cityMax > 0 ? r.total_seconds / cityMax * 100 : 0;
        h += `<tr><td>${esc(r.city)}</td><td><div class="bar-row"><div class="bar-container" style="min-width:160px;"><div class="bar-fill" style="width:${bp.toFixed(1)}%"></div></div><span class="bar-text">${fmtDuration(r.total_seconds)}</span></div></td><td>${r.sessions}</td><td>${r.users}</td></tr>`;
    });
    h += '</tbody></table></div></div>';
    h += '</div></div>';
    h += `<div class="footer">VPN连接汇总报表 | 数据源：${esc(d.fileName)} | 生成时间：${new Date().toLocaleString('zh-CN')}</div>`;
    return h;
}

function generateDailyTrendSVG(dailyAgg) {
    const n = dailyAgg.length;
    if (n === 0) return '<p style="color:#999;">无数据</p>';
    const cw=1280, ch=360, ml=60, mr=60, mt=20, mb=50;
    const pw=cw-ml-mr, ph=ch-mt-mb, bw=pw/n*0.55, bg=pw/n;
    const maxH = Math.max(...dailyAgg.map(r => r.total_seconds / 3600));
    const maxU = Math.max(...dailyAgg.map(r => r.users));
    let s = `<svg viewBox="0 0 ${cw} ${ch}" style="width:100%;height:auto;" xmlns="http://www.w3.org/2000/svg">`;
    for (let i=0; i<5; i++) {
        const y = mt + ph*(1-i/4);
        s += `<line x1="${ml}" y1="${y.toFixed(0)}" x2="${cw-mr}" y2="${y.toFixed(0)}" stroke="#e0e0e0" stroke-width="1"/>`;
        s += `<text x="${ml-8}" y="${(y+4).toFixed(0)}" text-anchor="end" font-size="10" fill="#999">${(maxH*i/4).toFixed(0)}h</text>`;
    }
    for (let i=0; i<5; i++) {
        const y = mt + ph*(1-i/4);
        s += `<text x="${cw-mr+8}" y="${(y+4).toFixed(0)}" text-anchor="start" font-size="10" fill="#999">${Math.round(maxU*i/4)}</text>`;
    }
    for (let i=0; i<n; i++) {
        const r = dailyAgg[i], hrs = r.total_seconds / 3600;
        const x = ml + bg*i + (bg-bw)/2, bh = maxH > 0 ? hrs/maxH*ph : 0, y = mt + ph - bh;
        s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="url(#barGrad)"/>`;
        s += `<title>${r.date}: ${hrs.toFixed(1)}h, ${r.users}用户</title>`;
    }
    let pts = [];
    for (let i=0; i<n; i++) {
        const x = ml + bg*i + bg/2, y = mt + ph - (maxU > 0 ? dailyAgg[i].users/maxU*ph : 0);
        pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    }
    s += `<polyline points="${pts.join(' ')}" fill="none" stroke="#e65100" stroke-width="2" stroke-linejoin="round"/>`;
    for (let i=0; i<n; i++) {
        const x = ml + bg*i + bg/2, y = mt + ph - (maxU > 0 ? dailyAgg[i].users/maxU*ph : 0);
        s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="#e65100"/>`;
    }
    for (let i=0; i<n; i++) {
        if (i % 7 === 0 || i === n-1) {
            const x = ml + bg*i + bg/2;
            const parts = dailyAgg[i].date.split('-');
            s += `<text x="${x.toFixed(0)}" y="${ch-20}" text-anchor="middle" font-size="10" fill="#999">${parts[1]}/${parts[2]}</text>`;
        }
    }
    s += '<defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3949ab"/><stop offset="100%" stop-color="#5c6bc0"/></linearGradient></defs></svg>';
    return s;
}

function generateHourlyTrendSVG(loginAvgs, onlineAvgs) {
    const cw=1280, ch=320, ml=60, mr=70, mt=20, mb=50;
    const pw=cw-ml-mr, ph=ch-mt-mb, bw=pw/24*0.5, bg=pw/24;
    const maxLogin = Math.max(...loginAvgs, 0.1), maxOnline = Math.max(...onlineAvgs, 0.1);
    let s = `<svg viewBox="0 0 ${cw} ${ch}" style="width:100%;height:auto;" xmlns="http://www.w3.org/2000/svg">`;
    for (let i=0; i<5; i++) {
        const y = mt + ph*(1-i/4);
        s += `<line x1="${ml}" y1="${y.toFixed(0)}" x2="${cw-mr}" y2="${y.toFixed(0)}" stroke="#e8e8e8" stroke-width="1"/>`;
        s += `<text x="${ml-8}" y="${(y+4).toFixed(0)}" text-anchor="end" font-size="10" fill="#999">${(maxLogin*i/4).toFixed(1)}</text>`;
    }
    for (let i=0; i<5; i++) {
        const y = mt + ph*(1-i/4);
        s += `<text x="${cw-mr+8}" y="${(y+4).toFixed(0)}" text-anchor="start" font-size="10" fill="#999">${(maxOnline*i/4).toFixed(0)}</text>`;
    }
    for (let h=0; h<24; h++) {
        const x = ml + bg*h + (bg-bw)/2, bh = maxLogin > 0 ? loginAvgs[h]/maxLogin*ph : 0, y = mt + ph - bh;
        s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="url(#barGrad2)"/>`;
        s += `<text x="${(x+bw/2).toFixed(0)}" y="${(y-4).toFixed(0)}" text-anchor="middle" font-size="9" fill="#3949ab" font-weight="600">${loginAvgs[h].toFixed(1)}</text>`;
        s += `<title>${String(h).padStart(2,'0')}:00 平均登录${loginAvgs[h].toFixed(1)}次, 平均在线${onlineAvgs[h].toFixed(0)}人</title>`;
    }
    let pts = [];
    for (let h=0; h<24; h++) {
        const x = ml + bg*h + bg/2, y = mt + ph - (maxOnline > 0 ? onlineAvgs[h]/maxOnline*ph : 0);
        pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    }
    s += `<polyline points="${pts.join(' ')}" fill="none" stroke="#e65100" stroke-width="2.5" stroke-linejoin="round"/>`;
    for (let h=0; h<24; h++) {
        const x = ml + bg*h + bg/2, y = mt + ph - (maxOnline > 0 ? onlineAvgs[h]/maxOnline*ph : 0);
        s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#e65100"/>`;
        s += `<text x="${x.toFixed(0)}" y="${(y-8).toFixed(0)}" text-anchor="middle" font-size="9" fill="#e65100" font-weight="600">${onlineAvgs[h].toFixed(0)}</text>`;
    }
    for (let h=0; h<24; h++) {
        const x = ml + bg*h + bg/2;
        s += `<text x="${x.toFixed(0)}" y="${ch-18}" text-anchor="middle" font-size="10" fill="#999">${String(h).padStart(2,'0')}</text>`;
    }
    s += `<text x="${(ml+pw/2).toFixed(0)}" y="${ch-2}" text-anchor="middle" font-size="11" fill="#666">小时（24小时制）</text>`;
    s += '<defs><linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3949ab"/><stop offset="100%" stop-color="#5c6bc0"/></linearGradient></defs></svg>';
    return s;
}

// ===== Event Handlers =====
document.getElementById('uploadWidget').addEventListener('click', function() {
    document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', function(e) {
    if (e.target.files[0]) handleFile(e.target.files[0]);
});

// Drag and drop
const widget = document.getElementById('uploadWidget');
['dragenter', 'dragover'].forEach(evt => {
    widget.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); widget.classList.add('dragover'); });
});
['dragleave', 'drop'].forEach(evt => {
    widget.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); widget.classList.remove('dragover'); });
});
widget.addEventListener('drop', e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && file.name.toLowerCase().endsWith('.csv')) handleFile(file);
    else document.getElementById('uploadHint').textContent = '请拖入 .csv 文件';
});

// Init
document.getElementById('genTime').textContent = '--';
</script>
